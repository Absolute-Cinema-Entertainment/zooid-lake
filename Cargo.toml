[package]
name = "zooid-lake"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "2.5D aquatic evolution survival game"
readme = "README.md"
repository = "https://github.com/Absolute-Cinema-Entertainment/zooid-lake"
license-file = "LICENSE.txt"
keywords = ["2d", "game"]
categories = ["games"]

[dependencies]
avian2d = {
  version = "0.7.0",
  default-features = false,
  features = [
    "default-collider",
    "2d",
    "bevy_picking",
    "f32",
    "parallel",
    "parry-f32",
    "simd",
    "xpbd_joints"
  ]
}
bevy = {
  version = "0.19.0",
  default-features = false,
  features = [
    # "default_font",
    "async_executor",
    "bevy_asset",
    "bevy_audio",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_light",
    "bevy_material",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_picking",
    "bevy_post_process",
    "bevy_render",
    "bevy_state",
    # "bevy_text",
    "bevy_window",
    "bevy_winit",
    "flac",
    "keyboard",
    "mouse",
    "multi_threaded",
    "reflect_auto_register",
    "serialize",
    "std",
    "sysinfo_plugin",
    "tonemapping_luts",
    "touch",
    "zstd_rust"
  ]
}
postcard = {
  version = "1.1.3",
  default-features = false,
  features = ["use-std"]
}
rand = "0.10.2"
serde = "1.0.229"
strum = { version = "0.28.0", features = ["derive"] }
tinyvec = { version = "1.12.0", features = ["latest_stable_rust", "std"] }

# These are only depended upon to configure their options. The re-exported items from Bevy should be used instead.
_log = {
  package = "log",
  version = "*",
  default-features = false,
  features = ["max_level_info", "release_max_level_info"]
}
_tracing = {
  package = "tracing",
  version = "*",
  default-features = false,
  features = ["max_level_debug", "release_max_level_info"]
}

[build-dependencies]
embed-manifest = "1.5.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
directories = "6.0.0"

[target.'cfg(target_family = "wasm")'.dependencies]
base64 = "0.23.0"
bevy = {
  version = "0.19.0",
  default-features = false,
  features = [
    "web"
    # "web_asset_cache"
  ]
}
web-sys = { version = "0.3.103", features = ["Storage", "Window"] }

# These are only depended upon to configure their options. The versions here must match the ones used by our dependencies.
_getrandom = {
  package = "getrandom",
  version = "0.3.*",
  default-features = false,
  features = ["wasm_js"]
}
_getrandom2 = {
  package = "getrandom",
  version = "0.4.*",
  default-features = false,
  features = ["wasm_js"]
}

[features]
debug = ["bevy/debug", "bevy/debug_glam_assert"]  # "avian2d/validate"
wayland = ["bevy/wayland"]
webgl2 = ["bevy/webgl2"]
webgpu = ["bevy/webgpu"]
x11 = ["bevy/x11"]

[lints.clippy]
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

dead_code_pub_in_binary = "warn"
filetype_is_file = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
format_push_string = "warn"
get_unwrap = "warn"
implicit_clone = "warn"
mem_forget = "warn"
rc_mutex = "warn"
ref_patterns = "warn"
rest_pat_in_fully_bound_structs = "warn"
suspicious_xor_used_as_pow = "warn"
undocumented_unsafe_blocks = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"

cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cognitive_complexity = "allow"
enum_variant_names = "allow"
float_cmp = "allow"
integer_division = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
needless_for_each = "allow"
needless_pass_by_value = "allow"
option_if_let_else = "allow"
similar_names = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
type_complexity = "allow"
wildcard_dependencies = "allow"
wildcard_imports = "allow"

[profile.dev]
debug = false
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 3
debug = false
strip = "debuginfo"
codegen-units = 1

[profile.dev.package."avian2d"]
# TODO: Re-enable, together with `avian2d/validate` in our `debug` feature. These currently cause seemingly random panics when despawning creatures.
debug-assertions = false
overflow-checks = false

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[profile.release.package."*"]
opt-level = 3
debug = false
strip = "symbols"
debug-assertions = false
overflow-checks = false
codegen-units = 1
