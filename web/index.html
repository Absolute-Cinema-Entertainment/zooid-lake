<!doctype html>

<html>
	<head>
		<meta charset="utf-8" />
		<title>Zooid Lake</title>
		<style>
			body {
				margin: 0;
				overflow: hidden;
				background: #6f7e88;
			}
			canvas {
				width: 100vw;
				height: 100vh;
				display: block;
			}
		</style>
		<link
			data-trunk
			rel="rust"
			href="../Cargo.toml"
			data-cargo-features="webgpu"
			data-wasm-opt="0"
			data-wasm-opt-params="--enable-sign-ext --enable-threads --enable-mutable-globals --enable-nontrapping-float-to-int --enable-simd --enable-bulk-memory --enable-bulk-memory-opt --enable-exception-handling --enable-tail-call --enable-reference-types --enable-multivalue --enable-gc --enable-extended-const --enable-strings"
			data-reference-types
		/>
		<link data-trunk rel="copy-dir" href="../assets" />
		<link data-trunk rel="copy-dir" href="../dist/fallback" />
	</head>
	<body>
		<canvas id="bevy"></canvas>
		<div style="font-size:12px">
			<span style="color:white">If the game doesn't render correctly, your browser probably doesn't support WebGPU.</span>
			<a style="color:#c9dcfb" href="./fallback">Run the fallback WebGL2 version instead?</a>
		</div>
	</body>
</html>
