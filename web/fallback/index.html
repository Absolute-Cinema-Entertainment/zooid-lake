<!doctype html>

<html>
	<head>
		<meta charset="utf-8" />
		<title>Zooid Lake (WebGL2 Fallback)</title>
		<style>
			body {
				margin: 0;
				overflow: hidden;
				background: #6f7e88;
			}
			canvas {
				width: 100vw;
				height: 100vh;
				display: block;
			}
		</style>
		<link
			data-trunk
			rel="rust"
			href="../../Cargo.toml"
			data-cargo-features="webgl2"
			data-wasm-opt="0"
			data-wasm-opt-params="--enable-sign-ext --enable-threads --enable-mutable-globals --enable-nontrapping-float-to-int --enable-simd --enable-bulk-memory --enable-bulk-memory-opt --enable-exception-handling --enable-tail-call --enable-reference-types --enable-multivalue --enable-gc --enable-extended-const --enable-strings"
			data-reference-types
		/>
	</head>
	<body>
		<canvas id="bevy"></canvas>
	</body>
</html>
